name: Test VANTAGE Cloud Sync

on:
  push:
    branches: ["feature/cloud-sync", "feature/cloud-sync-phase2b", "feature/cloud-sync-phase2c", "fix/auth-magic-link-v152", "fix/device-bootstrap-v153", "feature/cloud-tab-v154", "fix/cloud-vitals-pull-v155", "fix/navigation-bind-v156", "fix/vitals-readback-v157"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run VANTAGE test suite
        run: npm test
